<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — التحقيق اليومي</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Cairo', sans-serif; }
  .glass-panel { background: rgba(17,24,39,0.75); backdrop-filter: blur(12px); border: 1px solid rgba(55,65,81,0.5); }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <span class="text-5xl">🔍</span>
    <h1 class="text-2xl font-bold text-red-500 mt-3">التحقيق اليومي</h1>
    <p class="text-sm text-gray-400 mt-1">مرحباً بعودتك يا محقق</p>
  </div>

  <div class="glass-panel rounded-2xl p-6 shadow-2xl">
    <h2 class="text-xl font-bold text-white mb-6 text-center">تسجيل الدخول</h2>

    <div class="space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-2">البريد الإلكتروني</label>
        <input id="email" type="email" placeholder="you@example.com" 
          class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm text-white focus:border-red-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-2">كلمة المرور</label>
        <input id="password" type="password" placeholder="••••••" 
          class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm text-white focus:border-red-500 focus:outline-none">
      </div>

      <p id="error" class="text-red-400 text-xs text-center hidden"></p>

      <button onclick="signIn()" id="login-btn"
        class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl transition">
        دخول
      </button>
    </div>

    <div class="text-center mt-6 pt-4 border-t border-gray-800">
      <p class="text-xs text-gray-400">
        ليس لديك حساب؟
        <a href="signup.html" class="text-red-400 hover:text-red-300 font-semibold">إنشاء حساب جديد</a>
      </p>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://mgbzefarncwwtzbutxkp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nYnplZmFybmN3d3R6YnV0eGtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NTY3NDYsImV4cCI6MjEwNjQzMjc0Nn0.XeBtZ_3kJ8W2QWvPTHnQ2kN7Sxrg4glnFEUByMlKzc0';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showError(msg) {
  const el = document.getElementById('error');
  el.innerText = msg;
  el.classList.remove('hidden');
}

async function signIn() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');

  if (!email || !password) return showError('الرجاء ملء جميع الحقول');

  btn.disabled = true;
  btn.innerText = 'جارٍ الدخول...';

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    btn.disabled = false;
    btn.innerText = 'دخول';
    return showError('البريد أو كلمة المرور غير صحيحة');
  }

  window.location.href = 'index.html';
}

// إذا كان مسجلاً بالفعل، انتقل مباشرة
supabaseClient.auth.getUser().then(({ data: { user } }) => {
  if (user) window.location.href = 'index.html';
});
</script>
</body>
</html>
